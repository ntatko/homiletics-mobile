# This workflow uses actions that are not certified by GitHub.
# They are provided by a third-party and are governed by
# separate terms of service, privacy policy, and support
# documentation.

name: Dart

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v3

      - uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          # Pinned to the version the app is built and released with.
          # 3.44.9 is the first with Xcode 27's one-arch-per-call lipo fix;
          # flutter_quill must stay compatible, so bump them together.
          flutter-version: '3.44.9'

      - name: Install dependencies
        run: flutter pub get

      # Uncomment this step to verify the use of 'dart format' on each commit.
      # - name: Verify formatting
      #   run: dart format --output=none --set-exit-if-changed .

      # Consider passing '--fatal-infos' for slightly stricter analysis.
      - name: Analyze project source
        run: flutter analyze

      # Your project will need to have tests in test/ and a dependency on
      # package:test for this step to succeed. Note that Flutter projects will
      # want to change this to 'flutter test'.
      - name: Run tests
        run: flutter test

  # Catches Windows-only breakage (plugins without a Windows build, native
  # code that doesn't compile with MSVC) on every PR. The installer itself
  # is built by windows-release.yml.
  windows:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          # Same pin as the build job above.
          flutter-version: '3.44.9'
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Build Windows app
        run: flutter build windows --release

      - name: Install Inno Setup
        run: choco install innosetup --no-progress -y

      # Compile the installer and install it silently, checking the files the
      # in-app updater relies on (lib/services/update_service.dart).
      - name: Build and smoke-test installer
        shell: pwsh
        run: |
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) {
            $iscc = (Get-Command iscc.exe -ErrorAction Stop).Source
          }
          & $iscc "/DAppVersion=0.0.1" `
            "/DSourceDir=$env:GITHUB_WORKSPACE\build\windows\x64\runner\Release" `
            "/DOutputDir=$env:GITHUB_WORKSPACE\dist" `
            installer\windows\homiletics.iss
          if ($LASTEXITCODE -ne 0) { throw "ISCC failed ($LASTEXITCODE)" }

          $dir = "$env:RUNNER_TEMP\HomileticsCI"
          $p = Start-Process dist\Homiletics-Setup.exe -Wait -PassThru -ArgumentList `
            '/VERYSILENT', '/SUPPRESSMSGBOXES', '/NORESTART', '/CURRENTUSER', "/DIR=$dir"
          if ($p.ExitCode -ne 0) { throw "Setup failed ($($p.ExitCode))" }
          foreach ($f in 'Homiletics.exe', 'install.ini', 'unins000.exe') {
            if (-not (Test-Path "$dir\$f")) { throw "Missing $f after install" }
          }
          Get-Content "$dir\install.ini"
          if (Get-Process Homiletics -ErrorAction SilentlyContinue) {
            throw "A silent install without /RELAUNCH=1 must not start the app"
          }
          $u = Start-Process "$dir\unins000.exe" -Wait -PassThru -ArgumentList '/VERYSILENT', '/SUPPRESSMSGBOXES'
          if ($u.ExitCode -ne 0) { throw "Uninstall failed ($($u.ExitCode))" }
